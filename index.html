<!DOCTYPE html>

<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>blog</title>
</head>
<style> 
header {
background-color: #183C63;
color: #FFFFFF;
text-align: center;
max-width: 800px;
margin: 0 auto;
}
main {
display: flex;
background-color: #FFFFFF;
color: #183C63;
text-align: center;
max-width: 800px;
margin: 0 auto;
}
img {
width: 80px;
height: 80px;
}
.btn-tema-escuro {
    position: fixed;
    bottom: 16px;
    right: 16px;  
    font-size: 26px;
    padding: 12px;  
    border: none;
    cursor: pointer;
}
</style>

<body>
    
    <header>
<h1>Meu blog tech</h1>
<p>Vou compartilhar conhecimentos sobre tecnologia e programação</p>

<img src="Gemini_tecnologia.png" alt="logotipo conceitual de tecnologia e educação: um livro aberto de onde emerge um cérebro digital brilhante, cercado por ícones de Wi-Fi, circuitos e lâmpada de ideia. Cores em tons de azul e branco.">
    </header>
<main>
    <div>
<h2>Meu primeiro post</h2>
<p>Por: Marcelo Paludetto</p>
<p class="artigo-autor">Boas-vindas ao meu novo blog! Aqui vou compartilhar dicas de programação e curiosidades da área de tecnologia.</p>
<button>❤️<span>0</span></button>
<button>👍<span>0</span></button>
<button class="btn-tema-escuro">Escuro</button>

</div>
</main>
</body>
<script>
    const botoes = document.querySelectorAll("button");
botoes.forEach(function(botao) {
botao.addEventListener("click", botaoClicado);

function botaoClicado() {
console.log("fui clicado");
let texto = botao.querySelector("span");
texto.textContent++;
const btnTemaEscuro = document.querySelector(".btn-tema-escuro");
btnTemaEscuro.addEventListener("click", mudaTema);
function mudaTema() {
    const corpoPagina = document.body;

    if (corpoPagina.classList.contains("tema-escuro")) {
        corpoPagina.classList.remove("tema-escuro");
    } else {
        corpoPagina.classList.add("tema-escuro");
    }
}
}
});
</script>
</html>
